<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NexGen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary)); padding: 2rem 0; box-sizing: border-box; overflow-y: auto;">
    <div style="position: fixed; top: 1.5rem; right: 1.5rem; display: flex; gap: 0.75rem; z-index: 1000;">
        <button id="rtl-toggle" class="btn btn-sm btn-secondary" title="Toggle RTL">
            <i class="fas fa-language"></i>
        </button>
        <button id="theme-toggle" class="btn btn-sm btn-secondary" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </div>
    <div class="card auth-card">
        <div class="text-center mb-4">
            <a href="../index.html" style="color: inherit;"><h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;"><i class="fas fa-bolt" style="color: var(--primary-color);"></i> NexGen</h1></a>
            <p style="color: var(--text-secondary);">Join our community today</p>
        </div>
        
        <form data-validate>
            <div class="grid grid-2" style="gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-input" required placeholder="John">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-input" required placeholder="Doe">
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" required placeholder="you@example.com">
            </div>
            
            <div class="form-group">
                <label class="form-label">Account Type</label>
                <select class="form-select" required>
                    <option value="">Select account type</option>
                    <option>Brand/Business</option>
                    <option>Influencer/Creator</option>
                    <option>Agency</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" required minlength="8" placeholder="Minimum 8 characters">
            </div>
            
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-input" required placeholder="Repeat password">
            </div>
            
            <label style="display: flex; align-items: start; gap: 0.5rem; margin-bottom: 1.5rem; cursor: pointer;">
                <input type="checkbox" required style="margin-top: 0.25rem;">
                <span style="font-size: 0.875rem; color: var(--text-secondary);">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
            </label>
            
            <div class="auth-buttons" style="display: flex; gap: 1rem;">
                <a href="user-dashboard.html" class="btn btn-primary" style="flex: 1; justify-content: center; text-decoration: none;">Register as Influencer</a>
                <a href="admin-dashboard.html" class="btn btn-secondary" style="flex: 1; justify-content: center; text-decoration: none;">Register as Admin</a>
            </div>
        </form>
        
        <div class="text-center mt-3">
            <p style="color: var(--text-secondary);">Already have an account? <a href="login.html">Sign in</a></p>
        </div>
    </div>
    
    <script src="../assets/js/main.js"></script>
</body>
</html>
