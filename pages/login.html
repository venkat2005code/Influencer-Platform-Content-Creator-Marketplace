<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NexGen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));">
    <div class="card" style="max-width: 450px; width: 90%; padding: 3rem;">
        <div class="text-center mb-4">
            <h1 style="font-size: 2rem;"><i class="fas fa-bolt" style="color: var(--primary-color);"></i> Welcome Back</h1>
            <p style="color: var(--text-secondary);">Sign in to your account</p>
        </div>
        
        <form data-validate>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" required placeholder="you@example.com">
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" required placeholder="••••••••">
            </div>
            
            <div class="flex justify-between items-center mb-3">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" style="font-size: 0.875rem;">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>
        
        <div class="text-center mt-3">
            <p style="color: var(--text-secondary);">Don't have an account? <a href="register.html">Sign up</a></p>
        </div>
        
        <div style="margin: 2rem 0; text-align: center; position: relative;">
            <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border-color);"></div>
            <span style="position: relative; background: var(--bg-primary); padding: 0 1rem; color: var(--text-muted); font-size: 0.875rem;">OR</span>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <button class="btn btn-secondary"><i class="fab fa-google"></i> Continue with Google</button>
            <button class="btn btn-secondary"><i class="fab fa-facebook-f"></i> Continue with Facebook</button>
        </div>
    </div>
    
    <script src="../assets/js/main.js"></script>
</body>
</html>
