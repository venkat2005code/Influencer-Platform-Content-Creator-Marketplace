<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NexGen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="../index.html" style="text-decoration: none; color: inherit;">
                    <h2 style="font-size: 1.5rem;"><i class="fas fa-bolt" style="color: var(--primary-color);"></i> NexGen</h2>
                </a>
            </div>
            
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="user-dashboard.html" class="sidebar-link ">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="user-campaigns.html" class="sidebar-link ">
                        <i class="fas fa-bullseye"></i> My Campaigns
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="user-earnings.html" class="sidebar-link ">
                        <i class="fas fa-dollar-sign"></i> Earnings
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="user-messages.html" class="sidebar-link ">
                        <i class="fas fa-envelope"></i> Messages
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="user-settings.html" class="sidebar-link active">
                        <i class="fas fa-cog"></i> Settings
                    </a>
                </li>
                <li class="sidebar-item" style="margin-top: 2rem;">
                    <a href="../index.html" class="sidebar-link">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </li>
            </ul>
            </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="dashboard-header">
                <div>
                    <button class="mobile-menu-toggle dashboard-menu-toggle" aria-label="Toggle sidebar menu" style="margin-bottom: 0.75rem;">
                        <span class="hamburger"></span>
                    </button>
                    <h1 style="font-size: 2rem;">Profile Settings</h1>
                    <p style="color: var(--text-secondary);">Update your creator profile and payout methods.</p>
                </div>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <button id="rtl-toggle" class="btn btn-sm btn-secondary" title="Toggle RTL">LTR</button>
                    <button id="theme-toggle" class="btn btn-sm btn-secondary"><i class="fas fa-moon"></i></button>
                    <div style="position: relative;">
                        <i class="fas fa-bell" style="font-size: 1.25rem; cursor: pointer;"></i>
                        <span style="position: absolute; top: -5px; right: -5px; background: var(--danger-color); color: white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 0.625rem; font-weight: 700;">3</span>
                    </div>
                    <img src="https://i.pravatar.cc/100?img=1" alt="Admin" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                </div>
            </div>

            
            <div class="grid grid-2" style="align-items: start;">
                <div class="card">
                    <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Creator Profile</h3>
                    <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem;">
                        <img src="https://i.pravatar.cc/100?img=1" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;">
                        <div>
                            <button class="btn btn-outline btn-sm mb-1">Upload Photo</button>
                        </div>
                    </div>
                    <form>
                        <div class="form-group">
                            <label class="form-label">Display Name</label>
                            <input type="text" class="form-input" value="Sarah Johnson">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Bio</label>
                            <textarea class="form-input" rows="3">Fashion and lifestyle creator based in NYC.</textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Profile</button>
                    </form>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 2rem;">
                    <div class="card">
                        <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Linked Socials</h3>
                        <div class="form-group" style="display: flex; gap: 1rem;">
                            <button class="btn btn-secondary" style="flex: 1; justify-content: center;"><i class="fab fa-instagram" style="color: #E1306C;"></i> Linked</button>
                            <button class="btn btn-outline" style="flex: 1; justify-content: center;"><i class="fab fa-tiktok"></i> Connect</button>
                        </div>
                    </div>
                    
                    <div class="card">
                        <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Payout Method</h3>
                        <div style="padding: 1rem; border: 1px solid var(--border-color); border-radius: 0.5rem; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <strong>PayPal</strong><br>
                                <span style="color: var(--text-secondary); font-size: 0.875rem;">sarah@example.com</span>
                            </div>
                            <button class="btn btn-secondary btn-sm">Edit</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
        // Initialize Charts
        document.addEventListener('DOMContentLoaded', function() {
            // Revenue Chart
            const revenueCtx = document.getElementById('revenueChart').getContext('2d');
            new Chart(revenueCtx, {
                type: 'line',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [{
                        label: 'Revenue ($)',
                        data: [12000, 19000, 15000, 25000, 22000, 30000],
                        borderColor: '#8b5cf6',
                        backgroundColor: 'rgba(139, 92, 246, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return '$' + value.toLocaleString();
                                }
                            }
                        }
                    }
                }
            });

            // User Statistics Chart
            const userCtx = document.getElementById('userChart').getContext('2d');
            new Chart(userCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Influencers', 'Brands', 'Agencies'],
                    datasets: [{
                        data: [12500, 8500, 2000],
                        backgroundColor: ['#8b5cf6', '#ec4899', '#06b6d4'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
