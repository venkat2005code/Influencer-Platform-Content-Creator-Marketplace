<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NexGen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary)); padding: 2rem 0; box-sizing: border-box; overflow-y: auto;">
    <div style="position: fixed; top: 1.5rem; right: 1.5rem; display: flex; gap: 0.75rem; z-index: 1000;">
        <button id="rtl-toggle" class="btn btn-sm btn-secondary" title="Toggle RTL">LTR</button>
        <button id="theme-toggle" class="btn btn-sm btn-secondary" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </div>
    <div class="card auth-card">
        <div class="text-center mb-4">
            <a href="../index.html" style="color: inherit;"><h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;"><i class="fas fa-bolt" style="color: var(--primary-color);"></i> NexGen</h1></a>
            <p style="color: var(--text-secondary);">Sign in to your account</p>
        </div>
        
        <form data-validate>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" required placeholder="you@example.com">
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" required placeholder="••••••••">
            </div>
            
            <div class="flex justify-between items-center mb-3">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" style="font-size: 0.875rem;">Forgot password?</a>
            </div>
            
            <div class="auth-buttons" style="display: flex; gap: 1rem;">
                <a href="user-dashboard.html" class="btn btn-primary" style="flex: 1; justify-content: center; text-decoration: none;">Login as Influencer</a>
                <a href="admin-dashboard.html" class="btn btn-secondary" style="flex: 1; justify-content: center; text-decoration: none;">Login as Admin</a>
            </div>
        </form>
        
        <div class="text-center mt-3">
            <p style="color: var(--text-secondary);">Don't have an account? <a href="register.html">Sign up</a></p>
        </div>
        
        <div style="margin: 2rem 0; text-align: center; position: relative;">
            <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border-color);"></div>
            <span style="position: relative; background: var(--bg-primary); padding: 0 1rem; color: var(--text-muted); font-size: 0.875rem;">OR</span>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <button class="btn btn-secondary" style="background: white; color: #757575; border-color: #e0e0e0; justify-content: center;"><i class="fab fa-google" style="color: #DB4437;"></i> Continue with Google</button>
            <button class="btn btn-primary" style="background: #4267B2; justify-content: center;"><i class="fab fa-facebook-f"></i> Continue with Facebook</button>
        </div>
    </div>
    
    <script src="../assets/js/main.js"></script>
</body>
</html>
