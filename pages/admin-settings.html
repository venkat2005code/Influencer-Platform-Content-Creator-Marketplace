<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NexGen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="../index.html" style="text-decoration: none; color: inherit;">
                    <h2 style="font-size: 1.5rem;"><i class="fas fa-bolt" style="color: var(--primary-color);"></i> NexGen</h2>
                </a>
            </div>
            
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="admin-dashboard.html" class="sidebar-link">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="admin-users.html" class="sidebar-link">
                        <i class="fas fa-users"></i> Users
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="admin-influencers.html" class="sidebar-link">
                        <i class="fas fa-star"></i> Influencers
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="admin-campaigns.html" class="sidebar-link">
                        <i class="fas fa-bullseye"></i> Campaigns
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="admin-orders.html" class="sidebar-link">
                        <i class="fas fa-shopping-cart"></i> Orders
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="admin-messages.html" class="sidebar-link">
                        <i class="fas fa-envelope"></i> Messages
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="admin-analytics.html" class="sidebar-link">
                        <i class="fas fa-chart-bar"></i> Analytics
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="admin-settings.html" class="sidebar-link active">
                        <i class="fas fa-cog"></i> Settings
                    </a>
                </li>
                <li class="sidebar-item" style="margin-top: 2rem;">
                    <a href="../index.html" class="sidebar-link">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="dashboard-header">
                <div>
                    <button class="mobile-menu-toggle dashboard-menu-toggle" aria-label="Toggle sidebar menu" style="margin-bottom: 0.75rem;">
                        <span class="hamburger"></span>
                    </button>
                    <h1 style="font-size: 2rem;">Platform Settings</h1>
                    <p style="color: var(--text-secondary);">Configure your administrative preferences and security.</p>
                </div>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <button id="rtl-toggle" class="btn btn-sm btn-secondary" title="Toggle RTL">LTR</button>
                    <button id="theme-toggle" class="btn btn-sm btn-secondary"><i class="fas fa-moon"></i></button>
                    <div style="position: relative;">
                        <i class="fas fa-bell" style="font-size: 1.25rem; cursor: pointer;"></i>
                        <span style="position: absolute; top: -5px; right: -5px; background: var(--danger-color); color: white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 0.625rem; font-weight: 700;">3</span>
                    </div>
                    <img src="https://i.pravatar.cc/100?img=11" alt="Admin" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                </div>
            </div>

            
            <div class="grid grid-2" style="align-items: start;">
                <!-- Profile Settings -->
                <div class="card">
                    <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Profile Information</h3>
                    <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem;">
                        <img src="https://i.pravatar.cc/100?img=11" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;">
                        <div>
                            <button class="btn btn-outline btn-sm mb-1">Change Avatar</button>
                            <p style="font-size: 0.875rem; margin: 0;">JPG, GIF or PNG. Max size of 800K</p>
                        </div>
                    </div>
                    <form>
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-input" value="Admin User">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-input" value="admin@nexgen.com">
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 2rem;">
                    <!-- Preferences -->
                    <div class="card">
                        <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Preferences</h3>
                        <div class="form-group">
                            <label class="form-label">Language</label>
                            <select class="form-select">
                                <option>English (US)</option>
                                <option>Spanish</option>
                                <option>French</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" checked> Receive email notifications for new users
                            </label>
                        </div>
                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" checked> Receive email notifications for payouts
                            </label>
                        </div>
                        <button class="btn btn-primary btn-sm">Update Preferences</button>
                    </div>
                    
                    <!-- Security -->
                    <div class="card">
                        <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Security</h3>
                        <div class="form-group">
                            <label class="form-label">Current Password</label>
                            <input type="password" class="form-input" placeholder="••••••••">
                        </div>
                        <div class="form-group">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-input" placeholder="••••••••">
                        </div>
                        <button class="btn btn-secondary btn-sm" style="color: var(--danger-color); border-color: var(--danger-color);">Change Password</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
        // Initialize Charts
        document.addEventListener('DOMContentLoaded', function() {
            // Revenue Chart
            const revenueCtx = document.getElementById('revenueChart').getContext('2d');
            new Chart(revenueCtx, {
                type: 'line',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [{
                        label: 'Revenue ($)',
                        data: [12000, 19000, 15000, 25000, 22000, 30000],
                        borderColor: '#8b5cf6',
                        backgroundColor: 'rgba(139, 92, 246, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return '$' + value.toLocaleString();
                                }
                            }
                        }
                    }
                }
            });

            // User Statistics Chart
            const userCtx = document.getElementById('userChart').getContext('2d');
            new Chart(userCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Influencers', 'Brands', 'Agencies'],
                    datasets: [{
                        data: [12500, 8500, 2000],
                        backgroundColor: ['#8b5cf6', '#ec4899', '#06b6d4'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
